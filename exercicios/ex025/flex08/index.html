<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.conteiner{
            display: flex;
            background-color: salmon;
            flex-flow: row nowrap;
        }

        div.item{
            flex-basis: 150px;
            background-color: skyblue;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            border: 1px solid black;

            /*Formas de flex*/
            flex: auto;
            flex: none;
            flex: initial;

            /*Shorthand de Flex sempre, grow primeiro, shrink segundo, basis terceiro*/

            flex: 0 1 auto;
        }

        #cx1{
            flex-grow: 2;
            flex-shrink: 3;
        }

        #cx2{
            flex-grow: 1;
            flex-shrink: 2;
        }


    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cx1">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item" id="cx2">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
